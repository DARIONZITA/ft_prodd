services:
  nginx:
    image: nginx:stable
    container_name: ft_prodd_nginx
    volumes:
      - ./nginx/ft_prodd.conf:/etc/nginx/conf.d/ft_prodd.conf:ro
      - ./nginx/proxy_params:/etc/nginx/proxy_params:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    ports:
      - "443:443"
      - "5555:5555"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:15
    container_name: ft_prodd_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      target: development
    container_name: ft_prodd_backend
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=3001
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN}
      - INTRA_42_CLIENT_ID=${INTRA_42_CLIENT_ID}
      - INTRA_42_CLIENT_SECRET=${INTRA_42_CLIENT_SECRET}
      - INTRA_42_CALLBACK_URL=${INTRA_42_CALLBACK_URL}
      - FRONTEND_URL=${FRONTEND_URL}
      - BACKEND_URL=${BACKEND_URL}
      - CORS_ORIGIN=${CORS_ORIGIN}
    expose:
      - "3001"
      - "5555"
    volumes:
      - ../backend:/app
      - ../websocket:/app/src/ws
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ../frontend
      target: development
    container_name: ft_prodd_frontend
    environment:
      - NODE_ENV=${NODE_ENV}
      - VITE_API_URL=/
      - VITE_UPLOADS_PROXY=http://ft_prodd_backend:3001
    expose:
      - "3000"
    volumes:
      - ../frontend:/app
      - ../websocket:/app/src/ws
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    stdin_open: true
    tty: true

volumes:
  postgres_data:
