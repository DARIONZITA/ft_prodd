# ===================================================
# Nginx — Reverse Proxy com TLS Termination
# ===================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --------------------------------------------------
    # Logs
    # --------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # --------------------------------------------------
    # Optimizações
    # --------------------------------------------------
    sendfile        on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # --------------------------------------------------
    # Mapa para suporte a WebSocket (wss://)
    # --------------------------------------------------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # --------------------------------------------------
    # Servidor HTTP — redireciona tudo para HTTPS
    # --------------------------------------------------
    server {
        listen 80;
        server_name localhost;

        # Redireccionamento permanente para HTTPS
        return 301 https://$host$request_uri;
    }

    # --------------------------------------------------
    # Servidor HTTPS — ponto de entrada principal
    # --------------------------------------------------
    server {
        listen 443 ssl;
        server_name localhost;

        # Certificados TLS self-signed
        ssl_certificate     /etc/nginx/certs/nginx-selfsigned.crt;
        ssl_certificate_key /etc/nginx/certs/nginx-selfsigned.key;

        # Protocolos e cifras seguras
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # --------------------------------------------------
        # Headers de segurança
        # --------------------------------------------------
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options           DENY always;
        add_header X-Content-Type-Options    nosniff always;
        add_header X-XSS-Protection          "1; mode=block" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

        # --------------------------------------------------
        # Proxy → Backend (API + Swagger + WebSocket)
        # /api/*  e  /socket.io/*
        # --------------------------------------------------
        location /api/ {
            proxy_pass         http://backend:3001;
            proxy_http_version 1.1;

            # WebSocket upgrade
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Headers para o backend saber o IP e protocolo real do cliente
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        location /socket.io/ {
            proxy_pass         http://backend:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --------------------------------------------------
        # Proxy → Adminer (GUI base de dados)
        # https://localhost/adminer
        # --------------------------------------------------
        location /adminer {
            proxy_pass         http://adminer:8080;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --------------------------------------------------
        # Proxy → Frontend (tudo o resto)
        # --------------------------------------------------
        location / {
            proxy_pass         http://frontend:3000;
            proxy_http_version 1.1;

            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 300s;
        }
    }
}
